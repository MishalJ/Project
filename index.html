<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Surprise</title>
    <style>
        :root {
            --primary-pink: #ffb7b2;
            --soft-yellow: #faf9f6;
            --text-color: #6d6875;
        }

        body {
            background-color: var(--soft-yellow);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            text-align: center;
        }

        /* Flower Petal Animation */
        .petal {
            position: absolute;
            background-color: #ffc0cb;
            border-radius: 150% 0 150% 0;
            opacity: 0.7;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); }
            100% { transform: translateY(110vh) rotate(360deg); }
        }

        .container {
            z-index: 10;
            padding: 20px;
        }

        .egg {
            width: 140px;
            height: 190px;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
            margin: 0 auto;
            cursor: pointer;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .egg:hover { transform: scale(1.05) rotate(2deg); }
        .egg:active { transform: scale(0.95); }

        .crack-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: rgba(255,255,255,0.5);
            display: none;
        }

        #message-box {
            display: none;
            animation: zoomIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        h1 { color: #b5838d; margin-bottom: 10px; }
        p { color: var(--text-color); line-height: 1.6; max-width: 280px; }
        .heart { color: #e5989b; font-size: 24px; }
    </style>
</head>
<body>

    <div class="container">
        <div id="egg-container">
            <div class="egg" onclick="reveal()">
                <span style="color: white; font-weight: bold; font-size: 0.9rem;">TAP ME</span>
            </div>
            <h2 style="color: #d4a5a5;">You have a delivery!</h2>
        </div>

        <div id="message-box">
            <div class="heart">❤️</div>
            <h1>Happy Easter!</h1>
            <p>Even though we're miles apart, you're the "some-bunny" I love the most.</p>
            <p>Can't wait to see you soon!</p>
            <p><strong>- Your Favorite Nerd</strong></p>
        </div>
    </div>

    <script>
        // Create falling petals
        function createPetal() {
            const petal = document.createElement('div');
            petal.classList.add('petal');
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.width = Math.random() * 15 + 10 + 'px';
            petal.style.height = petal.style.width;
            petal.style.animationDuration = Math.random() * 3 + 2 + 's';
            document.body.appendChild(petal);
            setTimeout(() => petal.remove(), 5000);
        }
        setInterval(createPetal, 300);

        function reveal() {
            document.getElementById('egg-container').style.display = 'none';
            document.getElementById('message-box').style.display = 'block';
            document.body.style.backgroundColor = "#fff5f5";
        }
    </script>
</body>
</html>
